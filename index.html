<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Private Connect</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { background-color: #080506; color: #ffffff; padding-bottom: 70px; }

        /* Top Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(15, 10, 11, 0.95);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2a1c1e;
        }
        .logo { font-size: 18px; font-weight: 900; color: #ff2a5f; letter-spacing: 1px; }
        .online-count { font-size: 12px; color: #4CAF50; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Filters */
        .filters { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .filter-btn {
            background: #2a1c1e; color: #dcdcdc; border: none; padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .filter-btn.active { background: #ff2a5f; color: #fff; }

        /* Grid Layout */
        .cam-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px; padding: 0 20px;
        }

        /* Cam Card with BLUR effect - Matching the Screenshot */
        .cam-card {
            position: relative; border-radius: 12px; overflow: hidden; height: 240px;
            cursor: pointer; border: 1px solid #2a1c1e; background: #1a1213; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .cam-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(12px); /* Deep blur for curiosity */
            transform: scale(1.1); /* Prevents blur edges from showing */
            transition: transform 0.3s;
        }
        .cam-card:hover .cam-img { transform: scale(1.15); }

        /* Overlays */
        .live-badge {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        /* Center Play/Call Icons */
        .play-icon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 35px; background: rgba(0,0,0,0.5); width: 60px; height: 60px;
            display: flex; justify-content: center; align-items: center; border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 12px 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.95) 80%);
        }
        .user-name { font-size: 15px; font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; color: #fff; }
        .user-name span { color: #4CAF50; font-size: 14px; } /* Verified Tick */
        .cam-type { font-size: 11px; color: #b3b3b3; }

        /* Bottom App Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: #0f0a0b;
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid #2a1c1e; z-index: 100;
        }
        .nav-item { text-align: center; color: #666; font-size: 20px; cursor: pointer; }
        .nav-item.active { color: #ff2a5f; }
        .nav-text { font-size: 10px; display: block; margin-top: 3px; font-weight: bold; }

        /* Action Modal (Hidden by default) */
        #action-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); z-index: 200;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #1c1516; width: 100%; max-width: 320px; padding: 30px 20px;
            border-radius: 16px; text-align: center; border: 1px solid #3d2c2e; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .spinner {
            width: 45px; height: 45px; border: 3px solid rgba(255,42,95,0.2); border-top: 3px solid #ff2a5f;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .modal-text { font-size: 13px; color: #a09799; margin-bottom: 25px; line-height: 1.5; }
        
        .cta-btn {
            background: #ff2a5f; color: #fff; text-decoration: none; display: block;
            padding: 16px; border-radius: 30px; font-weight: 900; font-size: 16px; letter-spacing: 0.5px;
            animation: pulse-btn 1.5s infinite;
        }
        @keyframes pulse-btn {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 95, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 42, 95, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 95, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">SecretConnect</div>
        <div class="online-count"><div class="dot"></div> 4,192 Online</div>
    </div>

    <div class="filters">
        <button class="filter-btn active">All Users</button>
        <button class="filter-btn">Webcam</button>
        <button class="filter-btn">Private Call</button>
        <button class="filter-btn">Audio Only</button>
    </div>

    <!-- The grid is empty here, JavaScript will auto-generate all cards -->
    <div class="cam-grid" id="dashboard-grid"></div>

    <div class="bottom-nav">
        <div class="nav-item active">📺 <span class="nav-text">Explore</span></div>
        <div class="nav-item">💬 <span class="nav-text">Chats</span></div>
        <div class="nav-item">🔔 <span class="nav-text">Alerts</span></div>
        <div class="nav-item">👤 <span class="nav-text">Profile</span></div>
    </div>

    <div id="action-modal">
        <div class="modal-content">
            <div class="spinner"></div>
            <div class="modal-title" id="modal-title-text">Connecting...</div>
            <div class="modal-text">Secure connection establishing. Please confirm your age on the next screen to unblur the video.</div>
            <a href="https://affizer.g2afse.com/sl?id=673e05e79ec786ee35734f69&pid=3844" class="cta-btn">CONFIRM & UNBLUR</a>
        </div>
    </div>

    <script>
        // The CPA Offer Link
        const offerLink = "https://affizer.g2afse.com/sl?id=673e05e79ec786ee35734f69&pid=3844";

        // Your provided images
        const imageUrls = [
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/zUhgoTkN_400x400.jpg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/post94873717708903160IMG_2631.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/photo_2026-02-01_19-40-54.jpg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faff59e27102.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafd6212320b.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafcae692d2c.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafc930da7d6.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafbe3fc1960.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafb9e5a7fc5.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafb12fc3117.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faf934c26dee.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faf445819aa1.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faf376edf756.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faf17e56f793.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faf12db448e5.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faeff2b47920.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faee27525158.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faece2309a62.jpeg?raw=true",

            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/ZUQYQVFNR3-thumb.jpg?raw=true"
        ];

        // Call Categories mapping to your screenshot design
        const callTypes = [
            { badge: '🔴 LIVE', bg: '#ff2a5f', icon: '▶️', text: 'Webcam • Live now' },
            { badge: '📞 CALL ME', bg: '#4CAF50', icon: '📹', text: 'Private Video Call' },
            { badge: '🔴 LIVE', bg: '#ff2a5f', icon: '▶️', text: 'Webcam • Live now' }, // Weighted to show more live cams
            { badge: '🎙️ AUDIO', bg: '#2196F3', icon: '📞', text: 'Voice Call Ready' }
        ];

        const grid = document.getElementById('dashboard-grid');

        // Dynamically build the grid
        imageUrls.forEach((imgUrl, index) => {
            // Generate a random User ID (e.g., User_8492)
            const randomUserId = "User_" + Math.floor(1000 + Math.random() * 90000);
            
            // Randomly select a call type
            const type = callTypes[Math.floor(Math.random() * callTypes.length)];

            // Create Card HTML
            const cardHTML = `
                <div class="cam-card" onclick="openModal('${randomUserId}')">
                    <img src="${imgUrl}" class="cam-img" loading="lazy" alt="user">
                    <div class="live-badge" style="background:${type.bg};">${type.badge}</div>
                    <div class="play-icon">${type.icon}</div>
                    <div class="card-info">
                        <div class="user-name">${randomUserId} <span>✔</span></div>
                        <div class="cam-type">${type.text}</div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });

        // The Mastermind Redirect Function
        let redirectTimer;
        
        function openModal(userId) {
            const modal = document.getElementById('action-modal');
            const titleText = document.getElementById('modal-title-text');
            
            modal.style.display = 'flex';
            titleText.innerText = `Connecting to ${userId}...`;

            // Auto-redirect user to the CPA offer after 2.5 seconds regardless of click!
            redirectTimer = setTimeout(() => {
                window.location.href = offerLink;
            }, 2500);
        }
    </script>

</body>
</html>
