<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Room Connection</title>
    <style>
        /* 100% Inspired by the provided image_704ef7.png */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            /* Exact vibrant red background */
            background-color: #f12545; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .container {
            /* Dark grey/brown box with soft shadow */
            background-color: #382c2e;
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .sub-text {
            font-size: 12px;
            color: #a09799;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Status Box for Trust Building */
        .status-box {
            background-color: #261d1e;
            border: 1px solid #4a3c3e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        .status-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #4CAF50; /* Green for online status */
            font-weight: bold;
            margin-bottom: 10px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        .warning-text {
            color: #f12545;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* The Big Red Button */
        .enter-btn {
            background-color: #f12545;
            color: #ffffff;
            border: none;
            padding: 15px 0;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
            box-shadow: 0 4px 15px rgba(241, 37, 69, 0.4);
        }

        .enter-btn:hover {
            background-color: #d11f3b;
        }
        
        /* Disabled state for button while loading */
        .enter-btn.disabled {
            background-color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #a09799;
        }

        .highlight {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">SECURE 1-ON-1 CAM CONNECTION</div>
        <div class="sub-text">Encrypted Peer-to-Peer Network</div>

        <div class="status-box">
            <div class="status-text" id="status-indicator">
                <div class="pulse-dot"></div>
                <span id="dynamic-text">Locating requested User ID...</span>
            </div>
            <p id="details-text" style="color: #a09799; display: none;">
                User <span class="highlight">#84920</span> is currently online in a Private Room. Waiting for you to join.
            </p>
        </div>

        <div class="warning-text">
            YOU MUST BE 18 OR OLDER TO ENTER!
        </div>

        <!-- Replace YOUR_CPA_LINK_HERE with your actual Trafee/Affizer link -->
        <a href="YOUR_CPA_LINK_HERE" id="action-btn" class="enter-btn disabled">PLEASE WAIT...</a>

        <div class="footer-text">
            Automatic connection will initiate after age verification. 100% Free & Secure.
        </div>
    </div>

    <script>
        // Psychological Script to build trust
        setTimeout(() => {
            document.getElementById('dynamic-text').innerText = "Connection Established!";
        }, 1500);

        setTimeout(() => {
            document.getElementById('details-text').style.display = "block";
            
            let btn = document.getElementById('action-btn');
            btn.classList.remove('disabled');
            btn.innerText = "VERIFY 18+ & CONNECT";
            
            // Allow clicking only after it says "VERIFY 18+ & CONNECT"
            btn.onclick = function(e) {
                if (btn.classList.contains('disabled')) {
                    e.preventDefault();
                }
            }
        }, 3000);
    </script>

</body>
</html>
