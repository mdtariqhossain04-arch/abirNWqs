<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Connect - Live</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        
        body { background-color: #050304; color: #ffffff; overflow-x: hidden; }

        /* --- DASHBOARD UI --- */
        .dashboard { padding-bottom: 80px; transition: filter 0.3s; }
        .dashboard.blurred { filter: blur(10px); pointer-events: none; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(10, 6, 8, 0.95);
            position: sticky; top: 0; z-index: 50; border-bottom: 1px solid #1f1416;
        }
        .logo { font-size: 20px; font-weight: 900; color: #ff2a5f; letter-spacing: 0.5px; }
        .online-count { font-size: 12px; color: #00e676; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #00e676; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .filters { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; white-space: nowrap; }
        .filter-btn { background: #1f1416; color: #aaa; border: none; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .filter-btn.active { background: #ff2a5f; color: #fff; }

        .cam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0 15px; }
        .cam-card { position: relative; border-radius: 14px; overflow: hidden; height: 230px; cursor: pointer; background: #110b0d; }
        .cam-img { width: 100%; height: 100%; object-fit: cover; filter: blur(8px); transform: scale(1.1); transition: transform 0.4s; }
        .cam-card:hover .cam-img { transform: scale(1.15); }
        
        .badge-live { position: absolute; top: 10px; left: 10px; background: #ff2a5f; color: #fff; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; }
        .badge-call { position: absolute; top: 10px; left: 10px; background: #00e676; color: #000; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; }
        
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
        
        .card-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 10px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.95) 80%); }
        .user-name { font-size: 15px; font-weight: bold; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; color: #fff; }
        .user-name span { color: #00e676; font-size: 14px; }
        .cam-type { font-size: 11px; color: #999; }

        /* --- FULL SCREEN CALL UI (INCOMING & OUTGOING) --- */
        .call-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
            background: rgba(10, 6, 8, 0.95); backdrop-filter: blur(20px);
            display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px;
        }
        
        .caller-info { text-align: center; margin-top: 40px; }
        .caller-avatar-wrapper { position: relative; width: 130px; height: 130px; margin: 0 auto 20px; }
        .caller-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ff2a5f; z-index: 2; position: relative; filter: blur(3px); }
        .pulse-ring {
            position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px;
            border: 2px solid #00e676; border-radius: 50%; animation: pulse-ring 1.5s infinite; z-index: 1;
        }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        
        .caller-id-large { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
        .call-status { font-size: 15px; color: #00e676; font-weight: 600; letter-spacing: 1px; }

        .call-actions { display: flex; gap: 30px; width: 100%; max-width: 300px; justify-content: center; margin-bottom: 30px; }
        .action-btn { width: 75px; height: 75px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .btn-decline { background: #ff3b30; color: #fff; }
        .btn-accept { background: #00e676; color: #fff; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* --- 18+ MASTERMIND VERIFICATION MODAL --- */
        .verification-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 300;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-box {
            background: #170f12; width: 100%; max-width: 340px; padding: 30px 25px;
            border-radius: 20px; text-align: center; border: 1px solid #362227; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .warning-icon { font-size: 45px; margin-bottom: 10px; }
        .modal-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: #b3b3b3; line-height: 1.5; margin-bottom: 25px; }
        
        .cpa-btn {
            background: #ff2a5f; color: #fff; text-decoration: none; display: block;
            padding: 16px; border-radius: 30px; font-weight: 900; font-size: 16px; text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(255, 42, 95, 0.4); transition: transform 0.2s;
        }
        .cpa-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <div class="logo">PrivateConnect</div>
            <div class="online-count"><div class="dot"></div> 5,291 Online</div>
        </div>

        <div class="filters">
            <button class="filter-btn active">All Users</button>
            <button class="filter-btn">Webcam</button>
            <button class="filter-btn">Video Call</button>
        </div>

        <div class="cam-grid" id="grid"></div>
    </div>

    <!-- FULL SCREEN CALL UI -->
    <div class="call-screen" id="call-screen">
        <div class="caller-info">
            <div class="caller-avatar-wrapper">
                <div class="pulse-ring" id="call-pulse"></div>
                <img src="" class="caller-img" id="caller-img" alt="avatar">
            </div>
            <div class="caller-id-large" id="caller-name">User_0000</div>
            <div class="call-status" id="call-status-text">INCOMING VIDEO CALL...</div>
        </div>

        <div class="call-actions" id="call-actions">
            <button class="action-btn btn-decline" onclick="declineCall()">✖</button>
            <button class="action-btn btn-accept" onclick="acceptCall()">📞</button>
        </div>
    </div>

    <!-- THE 18+ VERIFICATION BLOCKER -->
    <div class="verification-modal" id="verification-modal">
        <div class="modal-box">
            <div class="warning-icon">🔞</div>
            <div class="modal-title">Age Verification</div>
            <div class="modal-desc">Call interrupted! You must verify that you are 18 years or older to access private live calls. <br><br><span style="color:#00e676; font-weight:bold;">100% Free • No Charges</span></div>
            
            <!-- YOUR CPA LINK -->
            <a href="https://affizer.g2afse.com/sl?id=673e05e79ec786ee35734f69&pid=3844" class="cpa-btn">I AM 18+ CONTINUE</a>
        </div>
    </div>

    <script>
        // Data Setup
        const images = [
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/zUhgoTkN_400x400.jpg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/post94873717708903160IMG_2631.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/photo_2026-02-01_19-40-54.jpg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5faff59e27102.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafd6212320b.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafcae692d2c.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafc930da7d6.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafbe3fc1960.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafb9e5a7fc5.jpeg?raw=true",
            "https://github.com/gdjg536ydiv-bot/affizerp/blob/main/images_5fafb12fc3117.jpeg?raw=true"
        ];

        let usersList = [];

        // 1. Generate Dashboard Grid
        const grid = document.getElementById('grid');
        
        images.forEach((img, i) => {
            const uid = "User_" + Math.floor(10000 + Math.random() * 90000);
            const isCall = Math.random() > 0.5; // 50% chance Live, 50% Call Me
            
            usersList.push({ id: uid, img: img });

            const card = `
                <div class="cam-card" onclick="initiateCall('${uid}', '${img}')">
                    <img src="${img}" class="cam-img">
                    <div class="${isCall ? 'badge-call' : 'badge-live'}">${isCall ? '📞 CALL ME' : '🔴 LIVE'}</div>
                    <div class="play-btn">${isCall ? '📞' : '▶️'}</div>
                    <div class="card-info">
                        <div class="user-name">${uid} <span>✔</span></div>
                        <div class="cam-type">${isCall ? 'Private Video Call' : 'Webcam • Live now'}</div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', card);
        });

        // 2. Call Logic Elements
        const callScreen = document.getElementById('call-screen');
        const dash = document.getElementById('dashboard');
        const vModal = document.getElementById('verification-modal');
        const statusText = document.getElementById('call-status-text');
        const actionsDiv = document.getElementById('call-actions');
        
        let audioCtx;
        let ringInterval;

        function playRingtone() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                
                function beep() {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }
                beep();
                ringInterval = setInterval(beep, 1500);
                if(navigator.vibrate) navigator.vibrate([400, 200, 400]);
            } catch(e) { console.log('Audio wait'); }
        }

        function stopRingtone() { clearInterval(ringInterval); }

        // Trigger System Incoming Call
        function triggerIncomingCall() {
            if(callScreen.style.display === 'flex' || vModal.style.display === 'flex') return;
            
            const randomUser = usersList[Math.floor(Math.random() * usersList.length)];
            
            document.getElementById('caller-img').src = randomUser.img;
            document.getElementById('caller-name').innerText = randomUser.id;
            statusText.innerText = "INCOMING VIDEO CALL...";
            statusText.style.color = "#00e676";
            
            dash.classList.add('blurred');
            callScreen.style.display = 'flex';
            actionsDiv.style.display = 'flex';
            document.getElementById('call-pulse').style.display = 'block';

            playRingtone();
        }

        // Trigger User Initiated Call (Call Back)
        function initiateCall(uid, img) {
            document.getElementById('caller-img').src = img;
            document.getElementById('caller-name').innerText = uid;
            
            dash.classList.add('blurred');
            callScreen.style.display = 'flex';
            actionsDiv.style.display = 'none'; // Hide accept/decline buttons
            
            statusText.innerText = "Dialing securely...";
            statusText.style.color = "#ccc";
            document.getElementById('call-pulse').style.display = 'none';

            // Wait 2.5 seconds like a real call, then show verification!
            setTimeout(() => {
                showVerification();
            }, 2500);
        }

        // Accept the incoming call
        function acceptCall() {
            stopRingtone();
            actionsDiv.style.display = 'none';
            statusText.innerText = "Connecting...";
            statusText.style.color = "#fff";
            
            // Wait 2 seconds, then hit them with the block!
            setTimeout(() => {
                showVerification();
            }, 2000);
        }

        // Decline incoming call
        function declineCall() {
            stopRingtone();
            statusText.innerText = "Call Declined.";
            statusText.style.color = "#ff3b30";
            
            setTimeout(() => {
                callScreen.style.display = 'none';
                dash.classList.remove('blurred');
            }, 1000);
        }

        // SHOW THE MASTERMIND BLOCKER
        function showVerification() {
            stopRingtone();
            callScreen.style.display = 'none'; // hide dial screen
            vModal.style.display = 'flex'; // show blocker
        }

        // Auto call intervals (Every 15-20 seconds)
        setTimeout(() => {
            setInterval(triggerIncomingCall, 18000);
            triggerIncomingCall(); // Fire first one
        }, 10000);

        // Init Audio on first tap (Browser policy bypass)
        document.body.addEventListener('click', () => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }, {once:true});

    </script>
</body>
</html>
